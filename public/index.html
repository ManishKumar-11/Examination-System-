<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Exam System</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--text:#18211f;--muted:#566360;--brand:#0f766e;--line:#d8dfdc;--warn:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#101716;--card:#182321;--text:#e6efec;--muted:#9bb0aa;--brand:#3fb8aa;--line:#2a3a37;--warn:#ff9b8f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,sans-serif}
#app{max-width:720px;margin:0 auto;padding:20px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:14px 0;display:flex;flex-direction:column;gap:10px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
button{padding:10px 16px;border:0;border-radius:8px;background:var(--brand);color:#fff;font:inherit;cursor:pointer}
button.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.row{display:flex;gap:10px}
.opt{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opt input{width:auto}
.msg{color:var(--warn);margin:0}
.timer{font-size:24px;font-variant-numeric:tabular-nums}
.noselect{user-select:none;-webkit-user-select:none}
table{width:100%;border-collapse:collapse;background:var(--card)}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
